<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Agent Fight">
  <rect width="64" height="64" rx="13" fill="#0f1115"/>
  <!-- antenna -->
  <line x1="32" y1="7" x2="32" y2="15" stroke="#8a93a3" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="6" r="3" fill="#4f8cff"/>
  <!-- robot head -->
  <rect x="19" y="14" width="26" height="21" rx="6" fill="#e8ecf1"/>
  <rect x="16" y="20" width="4" height="8" rx="2" fill="#8a93a3"/>
  <rect x="44" y="20" width="4" height="8" rx="2" fill="#8a93a3"/>
  <!-- eyes -->
  <circle cx="27" cy="23.5" r="3.2" fill="#4f8cff"/>
  <circle cx="37" cy="23.5" r="3.2" fill="#4f8cff"/>
  <!-- mouth grid -->
  <rect x="25" y="29" width="14" height="3" rx="1.5" fill="#0f1115"/>
  <!-- boxing gloves -->
  <g>
    <!-- left glove -->
    <rect x="4" y="40" width="17" height="15" rx="7.5" fill="#ff3b3b"/>
    <circle cx="5" cy="47" r="4.2" fill="#ff3b3b"/>
    <rect x="6" y="53" width="13" height="6" rx="2.5" fill="#c62828"/>
    <!-- right glove -->
    <rect x="43" y="40" width="17" height="15" rx="7.5" fill="#ff3b3b"/>
    <circle cx="59" cy="47" r="4.2" fill="#ff3b3b"/>
    <rect x="45" y="53" width="13" height="6" rx="2.5" fill="#c62828"/>
  </g>
</svg>
