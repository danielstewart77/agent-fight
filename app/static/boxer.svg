<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 60" role="img" aria-label="boxing robot">
  <!-- antenna -->
  <line x1="18" y1="5" x2="18" y2="11" stroke="#8a93a3" stroke-width="2" stroke-linecap="round"/>
  <circle cx="18" cy="4" r="2.5" fill="#4f8cff"/>
  <!-- head (facing right / toward the title) -->
  <rect x="6" y="10" width="25" height="19" rx="6" fill="#e8ecf1"/>
  <rect x="3" y="16" width="3.5" height="7" rx="1.75" fill="#8a93a3"/>
  <!-- eyes, shifted toward the opponent -->
  <circle cx="18" cy="18" r="3" fill="#4f8cff"/>
  <circle cx="26" cy="18" r="3" fill="#4f8cff"/>
  <!-- mouth grille -->
  <rect x="13" y="23" width="12" height="2.6" rx="1.3" fill="#0f1115"/>
  <!-- neck + torso -->
  <rect x="15" y="29" width="8" height="3" fill="#8a93a3"/>
  <rect x="8" y="31" width="21" height="19" rx="6" fill="#c3ccd8"/>
  <rect x="8" y="42" width="21" height="2.6" fill="#8a93a3"/>
  <!-- legs -->
  <rect x="11" y="49" width="6" height="8" rx="2" fill="#aab4c2"/>
  <rect x="20" y="49" width="6" height="8" rx="2" fill="#aab4c2"/>
  <!-- boxing gloves held in a guard, out toward the title -->
  <g>
    <!-- wrists connecting to the body -->
    <rect x="26" y="32" width="7" height="6" rx="2" fill="#c62828"/>
    <rect x="28" y="41" width="7" height="6" rx="2" fill="#c62828"/>
    <!-- glove balls -->
    <rect x="31" y="29" width="14" height="13" rx="6.5" fill="#ff3b3b"/>
    <rect x="33" y="40" width="14" height="12" rx="6" fill="#ff3b3b"/>
    <!-- thumbs -->
    <circle cx="44" cy="31" r="3" fill="#ff3b3b"/>
    <circle cx="46" cy="42" r="3" fill="#ff3b3b"/>
  </g>
</svg>
